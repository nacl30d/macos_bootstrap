  #     value: true

  # - domain: "com.apple.menuextra.battery"
  #   configures:
  #   - key: ShowPercent
  #     type: string
  #     value: YES

  - domain: "com.apple.menuextra.clock"
    configures:
    - key: DateFormat
      type: string
      value: "EEE MMM d H:mm"
    - key: FlashDateSeparators
      type: bool
      value: no
    - key: IsAnalog
      type: bool
      value: no
    - key: ShowAMPM
      type: bool
      value: no
    - key: ShowDayOfWeek
      type: bool
      value: yes
    - key: ShowDate
      type: int
      value: 1 # always (0: when space allows, 2: never)

  - domain: "com.apple.controlcenter"
    configures:
    - key: NSStatusItem VisibleCC Bluetooth
      type: bool
      value: yes
    - key: NSStatusItem VisibleCC Sound
      type: bool
      value: yes

  - domain: "com.apple.controlcenter"
    host: currentHost
    configures:
    - key: Bluetooth
      type: int
      value: 2 # show in menu bar
    - key: Sound
      type: int
      value: 16 # always show in menu bar

  - domain: "com.apple.TextInputMenu"
    configures:
    - key: visible
      type: bool
      value: yes
