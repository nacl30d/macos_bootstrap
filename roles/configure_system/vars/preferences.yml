preferences:
  ## Global settings
  - domain: "NSGlobalDomain"
    configures:
    - key: AppleLanguages
      type: array
      value:
        - en-JP
        - ja-JP
    - key: AppleActionOnDoubleClick
      type: string
      value: Minimize
    - key: AppleShowAllExtensions
      type: bool
      value: yes
    - key: com.apple.keyboard.fnState
      type: bool
      value: yes
    - key: com.apple.trackpad.forceClick
      type: bool
      value: yes
    - key: com.apple.trackpad.scaling
      type: float
      value: 1.5
    - key: com.apple.sound.beep.volume
      type: float
      value: 0.3

  - domain: "com.apple.AppleMultitouchTrackpad"
    configures: &trackpad
    - key: Clicking
      type: bool
      value: yes
    - key: TrackpadThreeFingerDrag
      type: bool
      value: yes
    - key: TrackpadThreeFingerHorizSwipeGesture
      type: int
      value: 0
    - key: TrackpadThreeFingerVertSwipeGesture
      type: int
      value: 0
    - key: TrackpadThreeFingerTapGesture
      type: int
      value: 0
    - key: TrackpadRightClick
      type: bool
      value: yes
    - key: TrackpadFourFingerHorizSwipeGesture
      type: int
      value: 2
    - key: TrackpadFourFingerPinchGesture
      type: int
      value: 2

  # Magic Trackpad reads this domain instead of the built-in one
  - domain: "com.apple.driver.AppleBluetoothMultitouch.trackpad"
    configures: *trackpad

  - domain: "com.apple.dock"
    configures:
    - key: orientation
      type: string
      value: "left"
    - key: autohide
      type: bool
      value: yes
    - key: expose-group-apps
      type: bool
      value: yes
    - key: minimize-to-application
      type: bool
      value: yes
    - key: mru-spaces
      type: bool
      value: no
    - key: show-recents
      type: bool
      value: no
    - key: wvous-tl-corner
      type: int
      value: 13 # lock screen
    - key: wvous-tl-modifier
      type: int
      value: 0
    - key: wvous-br-corner
      type: int
      value: 1 # disabled
    - key: wvous-br-modifier
      type: int
      value: 0

  - domain: "com.apple.finder"
    configures:
    - key: ShowExternalHardDrivesOnDesktop
      type: bool
      value: yes
    - key: ShowHardDrivesOnDesktop
      type: bool
      value: no
    - key: ShowMountedServerOnDesktop
      type: bool
      value: yes
    - key: ShowRemovableMediaOnDesktop
      type: bool
      value: yes
    - key: ShowSidebar
      type: bool
      value: yes
    - key: FXPreferredViewStyle
      type: string
      value: "clmv"

  - domain: "com.apple.WindowManager"
    configures:
    - key: EnableStandardClickToShowDesktop
      type: bool
      value: no
    - key: EnableTiledWindowMargins
      type: bool
      value: no
    - key: EnableTilingByEdgeDrag
      type: bool
      value: no
    - key: EnableTopTilingByEdgeDrag
      type: bool
      value: no
    - key: HideDesktop
      type: bool
      value: yes

  - domain: "com.apple.screencapture"
    configures:
    - key: name
      type: string
      value: ""

  - domain: "com.apple.Safari.SandboxBroker"
    configures:
    - key: ShowDevelopMenu
      type: bool
      value: yes

